server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: tueste-payments
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 0
      connection-timeout: 10000
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    co.tueste.payments: INFO
    org.springframework.security: WARN

tueste:
  payments:
    mercado-pago-api-url: ${MP_API_URL:https://api.mercadopago.com}
    mercado-pago-access-token: ${MP_ACCESS_TOKEN}
    mercado-pago-webhook-secret: ${MP_WEBHOOK_SECRET}
    site-url: ${TUESTE_SITE_URL}
    notification-url: ${MP_NOTIFICATION_URL}
    jwt-issuer: ${PAYMENTS_JWT_ISSUER:tueste-web}
    jwt-audience: ${PAYMENTS_JWT_AUDIENCE:tueste-payments}
    jwt-public-key: ${PAYMENTS_JWT_PUBLIC_KEY}
